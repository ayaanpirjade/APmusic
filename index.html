    <meta name="application-name" content="APMUSIC" />
    <meta name="apple-mobile-web-app-title" content="APMUSIC" />

  <body class="bg-[#07090e] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-white overflow-x-hidden font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker for Android App Install & Offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('APMUSIC PWA Service Worker registered:', reg.scope),
            (err) => console.log('APMUSIC PWA Service Worker registration failed:', err)
          );
        });
      }
    </script>
  </body>
